name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify deployment outputs
        run: npm run check:dist
      - name: Install test browsers
        # Tests use headless Chromium; skip the unused full browser download.
        run: npx playwright install --with-deps --only-shell chromium webkit
      - name: Test storage in Chromium and WebKit
        run: npx playwright test
      - name: Save browser test failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-browser-test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
